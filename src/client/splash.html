<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RES-9000: Reddit Entertainment System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Press Start 2P', cursive;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }


      .background-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.6;
        z-index: 0;
        image-rendering: pixelated;
      }

      /* CRT scanlines overlay */
      .scanlines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.3) 2px,
          rgba(0, 0, 0, 0.3) 4px
        );
        pointer-events: none;
        z-index: 1;
      }

      /* Vignette effect */
      .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(0, 0, 0, 0.8) 100%
        );
        pointer-events: none;
        z-index: 2;
      }

      /* Glow effect on content */
      .splash-container {
        text-align: center;
        max-width: 400px;
        width: 100%;
        position: relative;
        z-index: 3;
        animation: glow-pulse 3s ease-in-out infinite;
      }

      @keyframes glow-pulse {
        0%, 100% {
          filter: drop-shadow(0 0 20px rgba(78, 205, 196, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 40px rgba(78, 205, 196, 0.6));
        }
      }

      .title {
        font-size: 14px;
        color: #ff6b6b;
        text-shadow: 2px 2px 0 #000;
        margin-bottom: 8px;
        line-height: 1.4;
      }

      .subtitle {
        font-size: 8px;
        color: #4ecdc4;
        margin-bottom: 24px;
        text-shadow: 1px 1px 0 #000;
      }

      .description {
        font-size: 8px;
        line-height: 1.8;
        color: #ccc;
        margin-bottom: 24px;
      }

      .play-button {
        font-family: 'Press Start 2P', cursive;
        font-size: 12px;
        padding: 16px 32px;
        background: #4ecdc4;
        color: #1a1a2e;
        border: none;
        cursor: pointer;
        text-shadow: none;
        box-shadow: 4px 4px 0 #000;
        transition: all 0.1s ease;
      }

      .play-button:hover {
        background: #45b7aa;
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #000;
      }

      .play-button:active {
        transform: translate(4px, 4px);
        box-shadow: none;
      }

      .icon {
        font-size: 32px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <img id="background-image" class="background-image" style="display: none;" alt="">
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="splash-container">
      <div class="icon">🎮</div>
      <h1 class="title" id="game-title">RES-9000</h1>
      <p class="subtitle">REDDIT ENTERTAINMENT SYSTEM</p>
      <p class="description">
        AI-powered retro game console. Create, play, and share 8-bit games!
      </p>
      <button class="play-button" id="play-button">PLAY NOW</button>
    </div>
    <script type="module" src="splash-main.js"></script>
  </body>
</html>
